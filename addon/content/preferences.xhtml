<groupbox
  id="interlinear-settings-root"
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <label><html:h2>Interlinear</html:h2></label>
  <html:p
    id="interlinear-introduction"
    style="margin: 0 0 8px 0; line-height: 1.6; max-width: 760px"
  ></html:p>
  <html:p
    id="interlinear-privacy-notice"
    style="margin: 0 0 12px 0; line-height: 1.6; max-width: 760px; font-weight: 600"
  ></html:p>

  <html:div id="interlinear-settings-actionbar" class="interlinear-actionbar">
    <html:button id="interlinear-save" type="button" class="interlinear-save-button"></html:button>
    <html:span
      id="interlinear-settings-status"
      class="interlinear-settings-status"
      role="status"
      aria-live="polite"
    ></html:span>
    <html:span id="interlinear-save-hint" class="interlinear-save-hint"></html:span>
  </html:div>

  <html:div id="interlinear-settings-nav" class="interlinear-nav">
    <html:span id="interlinear-nav-title" class="interlinear-nav-title"></html:span>
    <html:button
      id="interlinear-nav-service"
      type="button"
      class="interlinear-nav-button"
      data-target="interlinear-service-section"
    ></html:button>
    <html:button
      id="interlinear-nav-display"
      type="button"
      class="interlinear-nav-button"
      data-target="interlinear-display-mode-section"
    ></html:button>
    <html:button
      id="interlinear-nav-appearance"
      type="button"
      class="interlinear-nav-button"
      data-target="interlinear-appearance-section"
    ></html:button>
    <html:button
      id="interlinear-nav-scope"
      type="button"
      class="interlinear-nav-button"
      data-target="interlinear-page-section"
    ></html:button>
    <html:button
      id="interlinear-nav-glossary"
      type="button"
      class="interlinear-nav-button"
      data-target="interlinear-glossary-section"
    ></html:button>
    <html:button
      id="interlinear-nav-maintenance"
      type="button"
      class="interlinear-nav-button"
      data-target="interlinear-cache-section"
    ></html:button>
  </html:div>
</groupbox>

<groupbox id="interlinear-service-section">
  <label><html:h3 id="interlinear-service-title"></html:h3></label>
  <hbox align="center" style="margin-bottom: 8px">
    <html:label
      id="interlinear-engine-label"
      for="interlinear-engine"
      style="min-width: 180px"
    ></html:label>
    <html:select id="interlinear-engine" style="min-width: 360px; padding: 4px 8px">
      <html:option id="interlinear-engine-google" value="google"></html:option>
      <html:option id="interlinear-engine-openai" value="openai"></html:option>
      <html:option id="interlinear-engine-claude" value="claude"></html:option>
      <html:option id="interlinear-engine-gemini" value="gemini"></html:option>
      <html:option id="interlinear-engine-ollama" value="ollama"></html:option>
    </html:select>
  </hbox>
  <hbox align="center" style="margin-bottom: 8px">
    <html:label
      id="interlinear-source-language-label"
      for="interlinear-source-language"
      style="min-width: 180px"
    ></html:label>
    <html:select id="interlinear-source-language" style="width: 220px; padding: 4px 8px"
    ></html:select>
  </hbox>
  <hbox align="center" style="margin-bottom: 8px">
    <html:label
      id="interlinear-target-language-label"
      for="interlinear-target-language"
      style="min-width: 180px"
    ></html:label>
    <html:select
      id="interlinear-target-language"
      style="width: 220px; padding: 4px 8px"
    ></html:select>
  </hbox>
  <html:p id="interlinear-language-help" style="line-height: 1.6; margin: 0; max-width: 760px"
  ></html:p>
</groupbox>

<groupbox id="interlinear-google-section">
  <label><html:h3 id="interlinear-google-title"></html:h3></label>
  <hbox align="center" style="margin-bottom: 8px">
    <html:label
      id="interlinear-google-base-label"
      for="interlinear-google-base-url"
      style="min-width: 130px"
    ></html:label>
    <html:input
      id="interlinear-google-base-url"
      type="text"
      style="width: 430px; padding: 4px 6px"
      placeholder="https://translate.googleapis.com"
    />
  </hbox>
  <html:p
    id="interlinear-google-base-help"
    style="line-height: 1.6; margin: 0 0 8px 0; max-width: 760px"
  ></html:p>
  <html:p
    id="interlinear-google-help"
    style="line-height: 1.6; margin: 0 0 8px 0; max-width: 760px"
  ></html:p>
  <hbox align="center">
    <html:button id="interlinear-test-google" type="button" style="padding: 5px 12px"
    ></html:button>
    <html:span
      id="interlinear-test-google-status"
      class="interlinear-test-status"
      role="status"
      aria-live="polite"
    ></html:span>
  </hbox>
</groupbox>

<groupbox id="interlinear-openai-section">
  <label><html:h3 id="interlinear-openai-title"></html:h3></label>
  <hbox align="center" style="margin-bottom: 8px">

    <html:input

      type="text"
      style="width: 430px; padding: 4px 6px"
      placeholder="https://api.openai.com/v1/chat/completions"
    />
  </hbox>
  <html:p
    id="interlinear-openai-endpoint-help"
    style="line-height: 1.6; margin: 0 0 8px 0; max-width: 760px"
  ></html:p>
  <hbox align="center" style="margin-bottom: 8px">
    <html:label
      id="interlinear-openai-model-label"
      for="interlinear-openai-model"
      style="min-width: 130px"
    ></html:label>
    <html:input
      id="interlinear-openai-model"
      type="text"
      style="width: 430px; padding: 4px 6px"
      placeholder="gpt-4o-mini"
    />
  </hbox>
  <hbox align="center" style="margin-bottom: 8px">
    <html:label
      id="interlinear-openai-api-key-label"
      for="interlinear-openai-api-key"
      style="min-width: 130px"
    ></html:label>
    <html:input
      id="interlinear-openai-api-key"
      type="password"
      style="width: 430px; padding: 4px 6px"
    />
  </hbox>
  <html:p
    id="interlinear-openai-api-key-help"
    style="line-height: 1.6; margin: 0 0 8px 0; max-width: 760px"
  ></html:p>
  <hbox align="center" style="margin-bottom: 8px">
    <html:label
      id="interlinear-openai-temperature-label"
      for="interlinear-openai-temperature"
      style="min-width: 130px"
    ></html:label>
    <html:input
      id="interlinear-openai-temperature"
      type="number"
      min="0"
      max="2"
      step="0.1"
      style="width: 110px; padding: 4px 6px"
    />
    <html:span
      id="interlinear-openai-temperature-help"
      style="margin-left: 10px; max-width: 520px"
    ></html:span>
  </hbox>
  <html:p
    id="interlinear-openai-prompt-label"
    style="line-height: 1.6; margin: 0 0 4px 0; max-width: 760px"
  ></html:p>
  <html:textarea
    id="interlinear-openai-prompt"
    rows="5"
    style="width: 760px; max-width: 100%; padding: 4px 6px"
  ></html:textarea>
  <html:p
    id="interlinear-openai-prompt-help"
    style="line-height: 1.6; margin: 4px 0 8px 0; max-width: 760px"
  ></html:p>
  <hbox align="center">
    <html:button id="interlinear-test-openai" type="button" style="padding: 5px 12px"
    ></html:button>
    <html:span
      id="interlinear-test-openai-status"
      class="interlinear-test-status"
      role="status"
      aria-live="polite"
    ></html:span>
  </hbox>
</groupbox>

  <hbox align="center">

      role="status"
      aria-live="polite"

<groupbox id="interlinear-ollama-section">
  <label><html:h3 id="interlinear-ollama-title"></html:h3></label>
  <hbox align="center" style="margin-bottom: 8px">
    <html:label
      id="interlinear-ollama-url-label"
      for="interlinear-ollama-url"
      style="min-width: 130px"
    ></html:label>
    <html:input
      id="interlinear-ollama-url"
      type="text"

  </hbox>
  <hbox align="center" style="margin-bottom: 8px">

    ></html:label>

    />
  </hbox>
  <hbox align="center">
    <spacer width="130" />
    <html:button
      id="interlinear-test-ollama"
      type="button"
      style="padding: 5px 12px"
    ></html:button>
    <html:span
      id="interlinear-test-ollama-status"
      class="interlinear-test-status"
      role="status"
      aria-live="polite"
    ></html:span>
  </hbox>
</groupbox>

<groupbox id="interlinear-display-mode-section">
  <label><html:h3 id="interlinear-display-mode-title"></html:h3></label>
  <hbox align="center" style="margin-bottom: 8px">
    <html:label
      id="interlinear-display-mode-label"
      for="interlinear-display-mode"
      style="min-width: 180px"
    ></html:label>
    <html:select id="interlinear-display-mode" style="width: 260px; padding: 4px 8px">
      <html:option id="interlinear-display-mode-top-bottom" value="top-bottom"></html:option>
      <html:option id="interlinear-display-mode-side-by-side" value="side-by-side"></html:option>
      <html:option id="interlinear-display-mode-target-only" value="target-only"></html:option>
      <html:option id="interlinear-display-mode-source-only" value="source-only"></html:option>
    </html:select>
  </hbox>
  <html:p
    id="interlinear-display-mode-help"
    style="line-height: 1.6; margin: 0; max-width: 760px"
  ></html:p>
</groupbox>

<groupbox id="interlinear-interaction-section">
  <label><html:h3 id="interlinear-interaction-title"></html:h3></label>
  <hbox align="center" style="margin-bottom: 8px">
    <html:input id="interlinear-hover-translate" type="checkbox" />
    <html:label
      id="interlinear-hover-translate-label"
      for="interlinear-hover-translate"
      style="margin-left: 6px"
    ></html:label>
  </hbox>
  <hbox align="center" style="margin-bottom: 8px">
    <html:label
      id="interlinear-hover-delay-label"
      for="interlinear-hover-delay"
      style="min-width: 180px"
    ></html:label>
    <html:input
      id="interlinear-hover-delay"
      type="number"
      min="200"
      max="5000"
      step="100"
      style="width: 120px; padding: 4px 6px"
    />
    <html:label id="interlinear-hover-delay-unit" style="margin-left: 6px"></html:label>
  </hbox>
  <html:p
    id="interlinear-hover-help"
    style="line-height: 1.6; margin: 0 0 10px 0; max-width: 760px"
  ></html:p>
  <hbox align="center" style="margin-bottom: 8px">
    <html:input id="interlinear-shortcut-enabled" type="checkbox" />

      id="interlinear-shortcut-enabled-label"
      for="interlinear-shortcut-enabled"
      style="margin-left: 6px"
    ></html:label>
  </hbox>
  <hbox align="center" style="margin-bottom: 8px">
    <html:label
      id="interlinear-shortcut-label"
      for="interlinear-shortcut"
      style="min-width: 180px"

      style="width: 220px; padding: 4px 6px"
      placeholder="Alt+Enter"
    />

  <html:p
    id="interlinear-shortcut-help"
    style="line-height: 1.6; margin: 0 0 10px 0; max-width: 760px"
  ></html:p>
  <html:p
    id="interlinear-interaction-help"
    style="line-height: 1.6; margin: 0; max-width: 760px"
  ></html:p>
</groupbox>

  <hbox align="center" style="margin-bottom: 8px">

        id="interlinear-appearance-color-inherit-help"

      id="interlinear-appearance-color-presets"
      class="interlinear-color-presets"
    ></html:span>
    <html:span
      id="interlinear-appearance-color-error"

    <html:p

  <hbox align="center" style="margin-bottom: 4px">

      for="interlinear-appearance-font-family"
      style="min-width: 180px"

      id="interlinear-appearance-font-family"
      type="text"
      style="width: 240px; padding: 4px 6px"
    />
    <html:span
      id="interlinear-appearance-font-family-presets"
      class="interlinear-font-presets"
    ></html:span>
  </hbox>
  <html:p
    id="interlinear-appearance-font-family-help"
    style="line-height: 1.6; margin: 0 0 8px 0; max-width: 760px"
  ></html:p>
  <hbox align="center" style="margin-bottom: 8px">
    <html:label
      id="interlinear-appearance-line-height-label"
      for="interlinear-appearance-line-height"
      style="min-width: 180px"
    ></html:label>
    <html:input
      id="interlinear-appearance-line-height"
      type="number"
      min="1"
      max="2.5"
      step="0.05"
      style="width: 110px; padding: 4px 6px"
    />
    <html:span
      id="interlinear-appearance-line-height-help"
      style="margin-left: 10px; max-width: 520px"
    ></html:span>
  </hbox>
  <hbox align="center" style="margin-bottom: 8px">
    <html:label
      id="interlinear-appearance-paragraph-spacing-label"

      style="min-width: 180px"

    <html:input
      id="interlinear-appearance-paragraph-spacing"
      type="number"
      min="0"
      max="3"
      step="0.05"
      style="width: 110px; padding: 4px 6px"
    />
    <html:span
      id="interlinear-appearance-paragraph-spacing-help"
      style="margin-left: 10px; max-width: 520px"
    ></html:span>
