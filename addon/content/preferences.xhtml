<groupbox id="interlinear-settings-root">
  <html:div class="interlinear-page">
    <html:div class="interlinear-hero">
      <html:div id="interlinear-brand" class="interlinear-brand"></html:div>
      <html:div class="interlinear-hero-text">
        <html:p id="interlinear-introduction" class="interlinear-lede"></html:p>
      </html:div>
    </html:div>

    <html:p
      id="interlinear-privacy-notice"
      class="interlinear-callout"
      role="note"
    ></html:p>

    <html:div class="interlinear-sticky">
      <html:div class="interlinear-toolbar">
        <html:div
          id="interlinear-settings-tabs"
          class="interlinear-tabs"
          role="tablist"
          aria-label="Settings sections"
        >
          <html:button
            id="interlinear-tab-service"
            type="button"
            class="interlinear-tab"
            role="tab"
            data-tab="service"
            aria-selected="true"
            aria-controls="interlinear-service-section interlinear-google-section interlinear-openai-section interlinear-claude-section interlinear-gemini-section interlinear-ollama-section"
          ></html:button>
          <html:button
            id="interlinear-tab-display"
            type="button"
            class="interlinear-tab"
            role="tab"
            data-tab="display"
            aria-selected="false"
            aria-controls="interlinear-display-mode-section interlinear-interaction-section"
          ></html:button>
          <html:button
            id="interlinear-tab-appearance"
            type="button"
            class="interlinear-tab"
            role="tab"
            data-tab="appearance"
            aria-selected="false"
            aria-controls="interlinear-appearance-section"
          ></html:button>
          <html:button
            id="interlinear-tab-glossary"
            type="button"
            class="interlinear-tab"
            role="tab"
            data-tab="glossary"
            aria-selected="false"
            aria-controls="interlinear-glossary-section"
          ></html:button>
          <html:button
            id="interlinear-tab-advanced"
            type="button"
            class="interlinear-tab"
            role="tab"
            data-tab="advanced"
            aria-selected="false"
            aria-controls="interlinear-page-section interlinear-speed-section interlinear-cache-section interlinear-about-section"
          ></html:button>
        </html:div>

        <html:div
          id="interlinear-settings-actionbar"
          class="interlinear-toolbar-actions"
        >
          <html:span
            id="interlinear-settings-status"
            class="interlinear-settings-status"
            role="status"
            aria-live="polite"
          ></html:span>
          <html:span
            id="interlinear-save-hint"
            class="interlinear-save-hint"
            aria-live="polite"
          ></html:span>
          <html:button
            id="interlinear-save"
            type="button"
            class="interlinear-button interlinear-button-primary interlinear-save-button"
          ></html:button>
        </html:div>
      </html:div>
    </html:div>

    <html:div class="interlinear-content">
      <!-- Service and languages -->
      <html:div
        id="interlinear-service-section"
        class="interlinear-section"
        data-tab="service"
        role="region"
        aria-labelledby="interlinear-service-title"
      >
        <html:div class="interlinear-section-head">
          <html:h3 id="interlinear-service-title"></html:h3>
        </html:div>
        <html:div class="interlinear-card">
          <html:div class="interlinear-field">
            <html:label
              id="interlinear-engine-label"
              for="interlinear-engine"
              class="interlinear-field-label"
            ></html:label>
            <html:div class="interlinear-field-control">
              <html:select
                id="interlinear-engine"
                class="interlinear-select interlinear-select-wide"
              >
                <html:option id="interlinear-engine-google" value="google"></html:option>
                <html:option id="interlinear-engine-openai" value="openai"></html:option>
                <html:option id="interlinear-engine-claude" value="claude"></html:option>
                <html:option id="interlinear-engine-gemini" value="gemini"></html:option>
                <html:option id="interlinear-engine-ollama" value="ollama"></html:option>
              </html:select>
            </html:div>
          </html:div>
          <html:div class="interlinear-field">
            <html:label
              id="interlinear-source-language-label"
              for="interlinear-source-language"
              class="interlinear-field-label"
            ></html:label>
            <html:div class="interlinear-field-control">
              <html:select
                id="interlinear-source-language"
                class="interlinear-select"
              ></html:select>
            </html:div>
          </html:div>
          <html:div class="interlinear-field">
            <html:label
              id="interlinear-target-language-label"
              for="interlinear-target-language"
              class="interlinear-field-label"
            ></html:label>
            <html:div class="interlinear-field-control">
              <html:select
                id="interlinear-target-language"
                class="interlinear-select"
              ></html:select>
            </html:div>
          </html:div>
          <html:p id="interlinear-language-help" class="interlinear-help"></html:p>
        </html:div>
      </html:div>

      <!-- Google -->
      <html:div
        id="interlinear-google-section"
        class="interlinear-section"
        data-tab="service"
        data-engine="google"
        hidden="true"
        role="region"
        aria-labelledby="interlinear-google-title"
      >
        <html:div class="interlinear-section-head">
          <html:h3 id="interlinear-google-title"></html:h3>
        </html:div>
        <html:div class="interlinear-card">
          <html:div class="interlinear-field">
            <html:label
              id="interlinear-google-base-label"
              for="interlinear-google-base-url"
              class="interlinear-field-label"
            ></html:label>
            <html:div class="interlinear-field-control">
              <html:input
                id="interlinear-google-base-url"
                type="text"
                class="interlinear-input"
                placeholder="https://translate.googleapis.com"
              />
            </html:div>
          </html:div>
          <html:p id="interlinear-google-base-help" class="interlinear-help"></html:p>
          <html:p id="interlinear-google-help" class="interlinear-help"></html:p>
          <html:div class="interlinear-actions">
            <html:button
              id="interlinear-test-google"
              type="button"
              class="interlinear-button"
            ></html:button>
            <html:span
              id="interlinear-test-google-status"
              class="interlinear-test-status"
              role="status"
              aria-live="polite"
            ></html:span>
          </html:div>
        </html:div>
      </html:div>

      <!-- OpenAI-compatible -->
      <html:div
        id="interlinear-openai-section"
        class="interlinear-section"
        data-tab="service"
        data-engine="openai"
        hidden="true"
        role="region"
        aria-labelledby="interlinear-openai-title"
      >
        <html:div class="interlinear-section-head">
          <html:h3 id="interlinear-openai-title"></html:h3>
        </html:div>
        <html:div class="interlinear-card">
          <html:div class="interlinear-field">
            <html:label
              id="interlinear-openai-endpoint-label"
              for="interlinear-openai-endpoint"
              class="interlinear-field-label"
            ></html:label>
            <html:div class="interlinear-field-control">
              <html:input
                id="interlinear-openai-endpoint"
                type="text"
                class="interlinear-input"
                placeholder="https://api.openai.com/v1/chat/completions"
              />
            </html:div>
          </html:div>
          <html:p id="interlinear-openai-endpoint-help" class="interlinear-help"></html:p>
          <html:div class="interlinear-field">
            <html:label
              id="interlinear-openai-model-label"
              for="interlinear-openai-model"
              class="interlinear-field-label"
            ></html:label>
            <html:div class="interlinear-field-control">
              <html:input
                id="interlinear-openai-model"
                type="text"
                class="interlinear-input"
                placeholder="gpt-4o-mini"
              />
            </html:div>
          </html:div>
          <html:div class="interlinear-field">
            <html:label
              id="interlinear-openai-api-key-label"
              for="interlinear-openai-api-key"
              class="interlinear-field-label"
            ></html:label>
            <html:div class="interlinear-field-control">
              <html:input
                id="interlinear-openai-api-key"
                type="password"
                class="interlinear-input"
              />
              <html:button
                type="button"
                class="interlinear-button interlinear-button-small interlinear-secret-toggle"
                data-target="interlinear-openai-api-key"
              ></html:button>
            </html:div>
          </html:div>
          <html:p id="interlinear-openai-api-key-help" class="interlinear-help"></html:p>
          <html:div class="interlinear-field">
            <html:label
              id="interlinear-openai-temperature-label"
              for="interlinear-openai-temperature"
              class="interlinear-field-label"
            ></html:label>
            <html:div class="interlinear-field-control">
              <html:input
                id="interlinear-openai-temperature"
                type="number"
                min="0"
                max="2"
                step="0.1"
                class="interlinear-input interlinear-input-number"
              />
            </html:div>
          </html:div>
          <html:p id="interlinear-openai-temperature-help" class="interlinear-help"></html:p>
          <html:div class="interlinear-field interlinear-field-stacked">
            <html:label
              id="interlinear-openai-prompt-label"
              for="interlinear-openai-prompt"
              class="interlinear-field-label"
            ></html:label>
            <html:div class="interlinear-field-control">
              <html:textarea
                id="interlinear-openai-prompt"
                rows="5"
                class="interlinear-textarea"
              ></html:textarea>
            </html:div>
            <html:p id="interlinear-openai-prompt-help" class="interlinear-help"></html:p>
          </html:div>
          <html:div class="interlinear-actions">
            <html:button
              id="interlinear-test-openai"
              type="button"
              class="interlinear-button"
            ></html:button>
            <html:span
              id="interlinear-test-openai-status"
              class="interlinear-test-status"
              role="status"
              aria-live="polite"
            ></html:span>
          </html:div>
        </html:div>
      </html:div>

      <!-- Claude -->
      <html:div
        id="interlinear-claude-section"
        class="interlinear-section"
        data-tab="service"
        data-engine="claude"
        hidden="true"
        role="region"
        aria-labelledby="interlinear-claude-title"
      >
        <html:div class="interlinear-section-head">
          <html:h3 id="interlinear-claude-title"></html:h3>
        </html:div>
        <html:div class="interlinear-card">
          <html:div class="interlinear-field">
            <html:label
              id="interlinear-claude-endpoint-label"
              for="interlinear-claude-endpoint"
              class="interlinear-field-label"
            ></html:label>
            <html:div class="interlinear-field-control">
              <html:input
                id="interlinear-claude-endpoint"
                type="text"
                class="interlinear-input"
                placeholder="https://api.anthropic.com/v1/messages"
              />
            </html:div>
          </html:div>
          <html:p id="interlinear-claude-endpoint-help" class="interlinear-help"></html:p>
          <html:div class="interlinear-field">
            <html:label
              id="interlinear-claude-model-label"
              for="interlinear-claude-model"
              class="interlinear-field-label"
            ></html:label>
            <html:div class="interlinear-field-control">
              <html:input
                id="interlinear-claude-model"
                type="text"
                class="interlinear-input"
                placeholder="claude-sonnet-4-5"
              />
            </html:div>
          </html:div>
          <html:div class="interlinear-field">
            <html:label
              id="interlinear-claude-api-key-label"
              for="interlinear-claude-api-key"
              class="interlinear-field-label"
            ></html:label>
            <html:div class="interlinear-field-control">
              <html:input
                id="interlinear-claude-api-key"
                type="password"
                class="interlinear-input"
              />
              <html:button
                type="button"
                class="interlinear-button interlinear-button-small interlinear-secret-toggle"
                data-target="interlinear-claude-api-key"
              ></html:button>
            </html:div>
          </html:div>
          <html:p id="interlinear-claude-api-key-help" class="interlinear-help"></html:p>
          <html:div class="interlinear-field">
            <html:label
              id="interlinear-claude-temperature-label"
              for="interlinear-claude-temperature"
              class="interlinear-field-label"
            ></html:label>
            <html:div class="interlinear-field-control">
              <html:input
                id="interlinear-claude-temperature"
                type="number"
                min="0"
                max="1"
                step="0.1"
                class="interlinear-input interlinear-input-number"
              />
            </html:div>
          </html:div>
          <html:p id="interlinear-claude-temperature-help" class="interlinear-help"></html:p>
          <html:div class="interlinear-field interlinear-field-stacked">
            <html:label
              id="interlinear-claude-prompt-label"
              for="interlinear-claude-prompt"
              class="interlinear-field-label"
            ></html:label>
            <html:div class="interlinear-field-control">
              <html:textarea
                id="interlinear-claude-prompt"
                rows="5"
                class="interlinear-textarea"
              ></html:textarea>
            </html:div>
            <html:p id="interlinear-claude-prompt-help" class="interlinear-help"></html:p>
          </html:div>
          <html:div class="interlinear-actions">
            <html:button
              id="interlinear-test-claude"
              type="button"
              class="interlinear-button"
            ></html:button>
            <html:span
              id="interlinear-test-claude-status"
              class="interlinear-test-status"
              role="status"
              aria-live="polite"
            ></html:span>
          </html:div>
        </html:div>
      </html:div>

      <!-- Gemini -->
      <html:div
        id="interlinear-gemini-section"
        class="interlinear-section"
        data-tab="service"
        data-engine="gemini"
        hidden="true"
        role="region"
        aria-labelledby="interlinear-gemini-title"
      >
        <html:div class="interlinear-section-head">
          <html:h3 id="interlinear-gemini-title"></html:h3>
        </html:div>
        <html:div class="interlinear-card">
          <html:div class="interlinear-field">
            <html:label
              id="interlinear-gemini-base-label"
              for="interlinear-gemini-base-url"
              class="interlinear-field-label"
            ></html:label>
            <html:div class="interlinear-field-control">
              <html:input
                id="interlinear-gemini-base-url"
                type="text"
                class="interlinear-input"
                placeholder="https://generativelanguage.googleapis.com"
              />
            </html:div>
          </html:div>
          <html:p id="interlinear-gemini-base-help" class="interlinear-help"></html:p>
          <html:div class="interlinear-field">
            <html:label
              id="interlinear-gemini-model-label"
              for="interlinear-gemini-model"
              class="interlinear-field-label"
            ></html:label>
            <html:div class="interlinear-field-control">
              <html:input
                id="interlinear-gemini-model"
                type="text"
                class="interlinear-input"
                placeholder="gemini-2.5-flash"
              />
            </html:div>
          </html:div>
          <html:div class="interlinear-field">
            <html:label
              id="interlinear-gemini-api-key-label"
              for="interlinear-gemini-api-key"
              class="interlinear-field-label"
            ></html:label>
            <html:div class="interlinear-field-control">
              <html:input
                id="interlinear-gemini-api-key"
                type="password"
                class="interlinear-input"
              />
              <html:button
                type="button"
                class="interlinear-button interlinear-button-small interlinear-secret-toggle"
                data-target="interlinear-gemini-api-key"
              ></html:button>
            </html:div>
          </html:div>
          <html:p id="interlinear-gemini-api-key-help" class="interlinear-help"></html:p>
          <html:div class="interlinear-field">
            <html:label
              id="interlinear-gemini-temperature-label"
              for="interlinear-gemini-temperature"
              class="interlinear-field-label"
            ></html:label>
            <html:div class="interlinear-field-control">
              <html:input
                id="interlinear-gemini-temperature"
                type="number"
                min="0"
                max="2"
                step="0.1"
                class="interlinear-input interlinear-input-number"
              />
            </html:div>
          </html:div>
          <html:p id="interlinear-gemini-temperature-help" class="interlinear-help"></html:p>
          <html:div class="interlinear-field interlinear-field-stacked">
            <html:label
              id="interlinear-gemini-prompt-label"
              for="interlinear-gemini-prompt"
              class="interlinear-field-label"
            ></html:label>
            <html:div class="interlinear-field-control">
              <html:textarea
                id="interlinear-gemini-prompt"
                rows="5"
                class="interlinear-textarea"
              ></html:textarea>
            </html:div>
            <html:p id="interlinear-gemini-prompt-help" class="interlinear-help"></html:p>
          </html:div>
          <html:div class="interlinear-actions">
            <html:button
              id="interlinear-test-gemini"
              type="button"
              class="interlinear-button"
            ></html:button>
            <html:span
              id="interlinear-test-gemini-status"
              class="interlinear-test-status"
              role="status"
              aria-live="polite"
            ></html:span>
          </html:div>
        </html:div>
      </html:div>

      <!-- Ollama -->
      <html:div
        id="interlinear-ollama-section"
        class="interlinear-section"
        data-tab="service"
        data-engine="ollama"
        hidden="true"
        role="region"
        aria-labelledby="interlinear-ollama-title"
      >
        <html:div class="interlinear-section-head">
          <html:h3 id="interlinear-ollama-title"></html:h3>
        </html:div>
        <html:div class="interlinear-card">
          <html:div class="interlinear-field">
            <html:label
              id="interlinear-ollama-url-label"
              for="interlinear-ollama-url"
              class="interlinear-field-label"
            ></html:label>
            <html:div class="interlinear-field-control">
              <html:input
                id="interlinear-ollama-url"
                type="text"
                class="interlinear-input"
                placeholder="http://127.0.0.1:11434"
              />
            </html:div>
          </html:div>
          <html:div class="interlinear-field">
            <html:label
              id="interlinear-ollama-model-label"
              for="interlinear-ollama-model"
              class="interlinear-field-label"
            ></html:label>
            <html:div class="interlinear-field-control">
              <html:input
                id="interlinear-ollama-model"
                type="text"
                class="interlinear-input"
                placeholder="gpt-oss:20b"
              />
            </html:div>
          </html:div>
          <html:div class="interlinear-actions">
            <html:button
              id="interlinear-test-ollama"
              type="button"
              class="interlinear-button"
            ></html:button>
            <html:span
              id="interlinear-test-ollama-status"
              class="interlinear-test-status"
              role="status"
              aria-live="polite"
            ></html:span>
          </html:div>
        </html:div>
      </html:div>

      <!-- Display mode -->
      <html:div
        id="interlinear-display-mode-section"
        class="interlinear-section"
        data-tab="display"
        hidden="true"
        role="region"
        aria-labelledby="interlinear-display-mode-title"
      >
        <html:div class="interlinear-section-head">
          <html:h3 id="interlinear-display-mode-title"></html:h3>
        </html:div>
        <html:div class="interlinear-card">
          <html:div class="interlinear-field">
            <html:label
              id="interlinear-display-mode-label"
              for="interlinear-display-mode"
              class="interlinear-field-label"
            ></html:label>
            <html:div class="interlinear-field-control">
              <html:select id="interlinear-display-mode" class="interlinear-select">
                <html:option
                  id="interlinear-display-mode-top-bottom"
                  value="top-bottom"
                ></html:option>
                <html:option
                  id="interlinear-display-mode-side-by-side"
                  value="side-by-side"
                ></html:option>
                <html:option
                  id="interlinear-display-mode-target-only"
                  value="target-only"
                ></html:option>
                <html:option
                  id="interlinear-display-mode-source-only"
                  value="source-only"
                ></html:option>
              </html:select>
            </html:div>
          </html:div>
          <html:p id="interlinear-display-mode-help" class="interlinear-help"></html:p>
        </html:div>
      </html:div>

      <!-- Paragraph translation -->
      <html:div
        id="interlinear-interaction-section"
        class="interlinear-section"
        data-tab="display"
        hidden="true"
        role="region"
        aria-labelledby="interlinear-interaction-title"
      >
        <html:div class="interlinear-section-head">
          <html:h3 id="interlinear-interaction-title"></html:h3>
        </html:div>
        <html:div class="interlinear-card">
          <html:div class="interlinear-check-row">
            <html:input
              id="interlinear-hover-translate"
              type="checkbox"
              class="interlinear-checkbox"
            />
            <html:label
              id="interlinear-hover-translate-label"
              for="interlinear-hover-translate"
              class="interlinear-check-label"
            ></html:label>
          </html:div>
          <html:div class="interlinear-field">
            <html:label
              id="interlinear-hover-delay-label"
              for="interlinear-hover-delay"
              class="interlinear-field-label"
            ></html:label>
            <html:div class="interlinear-field-control">
              <html:input
                id="interlinear-hover-delay"
                type="number"
                min="200"
                max="5000"
                step="100"
                class="interlinear-input interlinear-input-number"
              />
              <html:span id="interlinear-hover-delay-unit" class="interlinear-unit"></html:span>
            </html:div>
          </html:div>
          <html:p id="interlinear-hover-help" class="interlinear-help"></html:p>
          <html:div class="interlinear-field">
            <html:label
              id="interlinear-hover-modifier-label"
              for="interlinear-hover-modifier"
              class="interlinear-field-label"
            ></html:label>
            <html:div class="interlinear-field-control">
              <html:select id="interlinear-hover-modifier" class="interlinear-select">
                <html:option id="interlinear-hover-modifier-none" value="none"></html:option>
                <html:option id="interlinear-hover-modifier-alt" value="alt"></html:option>
                <html:option id="interlinear-hover-modifier-ctrl" value="ctrl"></html:option>
              </html:select>
            </html:div>
          </html:div>

          <html:div class="interlinear-divider"></html:div>

          <html:div class="interlinear-check-row">
            <html:input
              id="interlinear-shortcut-enabled"
              type="checkbox"
              class="interlinear-checkbox"
            />
            <html:label
              id="interlinear-shortcut-enabled-label"
              for="interlinear-shortcut-enabled"
              class="interlinear-check-label"
            ></html:label>
          </html:div>
          <html:div class="interlinear-field">
            <html:label
              id="interlinear-shortcut-label"
              for="interlinear-shortcut"
              class="interlinear-field-label"
            ></html:label>
            <html:div class="interlinear-field-control">
              <html:input
                id="interlinear-shortcut"
                type="text"
                class="interlinear-input interlinear-input-shortcut"
                placeholder="Alt+Enter"
              />
            </html:div>
          </html:div>
          <html:p id="interlinear-shortcut-help" class="interlinear-help"></html:p>
